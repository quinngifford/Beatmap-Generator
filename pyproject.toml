[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatmap-generator"
version = "1.0.0"
description = "Detect beats and significant sounds in a song and generate rhythm-game charts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
beatmap-generator = "beatmap_generator.cli:main"

[tool.setuptools]
packages = ["beatmap_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
